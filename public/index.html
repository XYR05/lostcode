<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost Code // Sign In</title>
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body>
  <div class="container">
    <!-- FORMS CONTAINER -->
    <div class="forms-container">
      <!-- Sign In Form -->
      <form class="sign-in-form" id="loginForm">
        <div class="auth-brand">
          <img src="/lost_code_logo.png" alt="Lost Code Logo" onerror="this.style.display='none';" />
          <div class="auth-brand-title">LOST CODE</div>
        </div>
        <h2>Sign In</h2>
        <div class="input-field">
          <input type="text" id="loginTeam" placeholder="Crew / Team Name (e.g. BUCCANEERS)" required autocomplete="username" />
        </div>
        <div class="input-field">
          <input type="password" id="loginPassword" placeholder="Secret Key / Password" required autocomplete="current-password" />
        </div>
        <p id="loginError" class="error-message"></p>
        <button type="submit" class="btn">Board the Ship</button>

        <div class="auth-footer-notice">
          <div class="auth-compass" title="Never Land Compass" aria-label="Compass">
            <svg viewBox="0 0 64 64" width="42" height="42" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#FFE7A5"/>
                  <stop offset="50%" stop-color="#D4A759"/>
                  <stop offset="100%" stop-color="#9C7132"/>
                </linearGradient>
                <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#9C7132"/>
                  <stop offset="50%" stop-color="#6B4B1B"/>
                  <stop offset="100%" stop-color="#3D280B"/>
                </linearGradient>
                <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
                  <stop offset="0%" stop-color="#FFE8B5"/>
                  <stop offset="60%" stop-color="#C99A52"/>
                  <stop offset="100%" stop-color="#5C3E14"/>
                </radialGradient>
                <filter id="compassShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#C99A52" flood-opacity="0.35"/>
                </filter>
              </defs>
              <g filter="url(#compassShadow)">
                <!-- Outer decorative rings -->
                <circle cx="32" cy="32" r="29" stroke="url(#goldLight)" stroke-width="1.2" opacity="0.65"/>
                <circle cx="32" cy="32" r="26" stroke="url(#goldLight)" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.45"/>
                <circle cx="32" cy="32" r="22" stroke="url(#goldLight)" stroke-width="0.6" opacity="0.3"/>

                <!-- Cardinal tick points -->
                <circle cx="32" cy="4" r="1.2" fill="url(#goldLight)"/>
                <circle cx="32" cy="60" r="1.2" fill="url(#goldLight)"/>
                <circle cx="4" cy="32" r="1.2" fill="url(#goldLight)"/>
                <circle cx="60" cy="32" r="1.2" fill="url(#goldLight)"/>

                <!-- Diagonal / Intermediate Points (8-point rose) -->
                <polygon points="32,32 32,15 35,32" fill="url(#goldLight)" opacity="0.8" transform="rotate(45 32 32)"/>
                <polygon points="32,32 32,15 29,32" fill="url(#goldDark)" opacity="0.8" transform="rotate(45 32 32)"/>
                <polygon points="32,32 32,15 35,32" fill="url(#goldLight)" opacity="0.8" transform="rotate(135 32 32)"/>
                <polygon points="32,32 32,15 29,32" fill="url(#goldDark)" opacity="0.8" transform="rotate(135 32 32)"/>
                <polygon points="32,32 32,15 35,32" fill="url(#goldLight)" opacity="0.8" transform="rotate(225 32 32)"/>
                <polygon points="32,32 32,15 29,32" fill="url(#goldDark)" opacity="0.8" transform="rotate(225 32 32)"/>
                <polygon points="32,32 32,15 35,32" fill="url(#goldLight)" opacity="0.8" transform="rotate(315 32 32)"/>
                <polygon points="32,32 32,15 29,32" fill="url(#goldDark)" opacity="0.8" transform="rotate(315 32 32)"/>

                <!-- Primary Cardinal Points -->
                <!-- North -->
                <polygon points="32,32 32,7 28,32" fill="url(#goldLight)"/>
                <polygon points="32,32 32,7 36,32" fill="url(#goldDark)"/>
                <!-- South -->
                <polygon points="32,32 32,57 36,32" fill="url(#goldLight)"/>
                <polygon points="32,32 32,57 28,32" fill="url(#goldDark)"/>
                <!-- East -->
                <polygon points="32,32 57,32 32,28" fill="url(#goldLight)"/>
                <polygon points="32,32 57,32 32,36" fill="url(#goldDark)"/>
                <!-- West -->
                <polygon points="32,32 7,32 32,36" fill="url(#goldLight)"/>
                <polygon points="32,32 7,32 32,28" fill="url(#goldDark)"/>

                <!-- Center Boss / Pivot -->
                <circle cx="32" cy="32" r="4.5" fill="url(#goldGlow)" stroke="url(#goldLight)" stroke-width="0.8"/>
                <circle cx="32" cy="32" r="1.8" fill="#FFECC0"/>
              </g>
            </svg>
          </div>
        </div>
      </form>
    </div>
  </div>

  <script src="app.js?v=2"></script>
</body>
</html>
