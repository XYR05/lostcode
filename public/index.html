<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost Code // Sign In</title>
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <div class="container">
    <!-- FORMS CONTAINER -->
    <div class="forms-container">
      <!-- Sign In Form -->
      <form class="sign-in-form" id="loginForm">
        <div class="auth-brand">
          <img src="/lost_code_logo.png" alt="Lost Code Logo" onerror="this.style.display='none';" />
          <div class="auth-brand-title">LOST CODE</div>
        </div>
        <h2>Sign In</h2>
        <div class="input-field">
          <input type="text" id="loginTeam" placeholder="Crew / Team Name (e.g. lostcode)" required />
        </div>
        <div class="input-field">
          <input type="password" id="loginPassword" placeholder="Secret Key / Password" required />
        </div>
        <p id="loginError" class="error-message"></p>
        <button type="submit" class="btn">Board the Ship</button>
      </form>

      <!-- Sign Up Form -->
      <form class="sign-up-form" id="registerForm">
        <div class="auth-brand">
          <img src="/lost_code_logo.png" alt="Lost Code Logo" onerror="this.style.display='none';" />
          <div class="auth-brand-title">LOST CODE</div>
        </div>
        <h2>Enlist Crew</h2>
        <div class="input-field">
          <input type="text" id="registerTeamName" placeholder="Crew / Team Name" required />
        </div>
        <div class="input-field">
          <input type="password" id="registerPassword" placeholder="Crew Password" required />
        </div>
        <div class="input-field">
          <input type="password" id="registerConfirmPassword" placeholder="Confirm Password" required />
        </div>
        <p id="registerError" class="error-message"></p>
        <button type="submit" class="btn">Enlist the Crew</button>
      </form>
    </div>

    <!-- PANELS CONTAINER -->
    <div class="panels-container">
      <!-- Left Panel (visible in sign-up-mode) -->
      <div class="panel left-panel">
        <div class="content">
          <h3>Already Sailing?</h3>
          <p>Already signed the pirate articles? Return to the helm and board the ship with your crew credentials.</p>
          <button class="btn transparent" id="signInBtn">Sign In</button>
        </div>
      </div>

      <!-- Right Panel (visible in normal mode) -->
      <div class="panel right-panel">
        <div class="content">
          <h3>New Buccaneer?</h3>
          <p>Join the Lost Code expedition! Enlist your pirate crew and sail for the hidden flags today.</p>
          <button class="btn transparent" id="signUpBtn">Enlist Crew</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
